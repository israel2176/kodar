<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קודאר — כלי קידוד ופענוח</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Rubik:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: #252a38;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --accent3: #a78bfa;
    --text: #e2e8f0;
    --muted: #64748b;
    --success: #34d399;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Rubik', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 2.5rem 0 3rem;
    position: relative;
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 0.75rem;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--accent);
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
    animation: pulse-border 3s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 20px rgba(0,229,255,0.3); }
    50% { box-shadow: 0 0 35px rgba(0,229,255,0.6); }
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Tab bar */
  .tabs {
    display: flex;
    gap: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.4rem;
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    padding: 0.65rem 1rem;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }

  .tab.active {
    background: var(--surface2);
    color: var(--accent);
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .tab-icon { font-size: 1rem; }

  /* Panel */
  .panel { display: none; animation: fadeIn 0.2s ease; }
  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .card-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .card-label span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.88rem;
    line-height: 1.6;
    padding: 0.9rem 1rem;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: ltr;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }

  textarea::placeholder { color: var(--muted); opacity: 0.5; }

  /* Action row */
  .actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 1rem 0;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.4rem;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #33eeff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,229,255,0.3); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  .btn-orange {
    background: var(--accent2);
    color: #fff;
  }
  .btn-orange:hover { background: #ff8555; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,107,53,0.3); }

  .btn-purple {
    background: var(--accent3);
    color: #fff;
  }
  .btn-purple:hover { background: #c4b5fd; transform: translateY(-1px); }

  .btn:active { transform: translateY(0) scale(0.97); }

  /* Output area */
  .output-area {
    position: relative;
  }

  .copy-btn {
    position: absolute;
    top: 0.6rem;
    left: 0.6rem;
    padding: 0.3rem 0.7rem;
    font-size: 0.72rem;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--sans);
    transition: all 0.15s;
    z-index: 2;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); }

  /* Image preview */
  .img-preview {
    margin-top: 1rem;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    min-height: 80px;
    display: none;
    background: var(--bg);
  }
  .img-preview.visible { display: block; }
  .img-preview img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  .img-preview .img-meta {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(0,229,255,0.03); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone .uz-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .upload-zone .uz-text { color: var(--muted); font-size: 0.85rem; }
  .upload-zone .uz-text strong { color: var(--accent); }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0.5rem 0;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Status badge */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-family: var(--mono);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    margin-top: 0.5rem;
  }
  .status.ok { background: rgba(52,211,153,0.1); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
  .status.err { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }

  /* Swap button */
  .swap-row {
    display: flex;
    justify-content: center;
    margin: -0.2rem 0;
    position: relative;
    z-index: 2;
  }
  .swap-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .swap-btn:hover { color: var(--accent); border-color: var(--accent); transform: rotate(180deg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Footer */
  footer {
    text-align: center;
    padding-top: 2rem;
    color: var(--muted);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .tabs { flex-wrap: wrap; }
    .tab { flex: none; width: calc(50% - 0.25rem); }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-line">
      <div class="logo-icon">{ }</div>
      <h1>קודאר</h1>
    </div>
    <p class="subtitle">כלי קידוד ופענוח · URL · Base64</p>
  </header>

  <!-- Tab bar -->
  <div class="tabs" role="tablist">
    <button class="tab active" onclick="switchTab('url')" role="tab">
      <span class="tab-icon">🔗</span> URL Encode/Decode
    </button>
    <button class="tab" onclick="switchTab('b64text')" role="tab">
      <span class="tab-icon">📄</span> Base64 טקסט
    </button>
    <button class="tab" onclick="switchTab('b64img')" role="tab">
      <span class="tab-icon">🖼️</span> Base64 תמונה
    </button>
  </div>

  <!-- ══════════ URL PANEL ══════════ -->
  <div class="panel active" id="panel-url">

    <div class="card">
      <div class="card-label"><span></span> קלט</div>
      <textarea id="url-input" placeholder="הכנס טקסט רגיל או URL מקודד...&#10;לדוגמה: %D7%A9%D7%9C%D7%95%D7%9D*%D7%A2%D7%95%D7%9C%D7%9D"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="urlDecode()">⬇ פענח (Decode)</button>
      <button class="btn btn-orange" onclick="urlEncode()">⬆ קודד (Encode)</button>
      <button class="btn btn-secondary" onclick="clearUrl()">✕ נקה</button>
    </div>

    <div class="card">
      <div class="card-label"><span></span> פלט</div>
      <div class="output-area">
        <button class="copy-btn" onclick="copyText('url-output', this)">העתק</button>
        <textarea id="url-output" readonly placeholder="התוצאה תופיע כאן..."></textarea>
      </div>
      <div id="url-status"></div>
    </div>

  </div>

  <!-- ══════════ BASE64 TEXT PANEL ══════════ -->
  <div class="panel" id="panel-b64text">

    <div class="card">
      <div class="card-label"><span></span> קלט</div>
      <textarea id="b64-input" placeholder="הכנס טקסט רגיל או Base64..."></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="b64Decode()">⬇ פענח Base64</button>
      <button class="btn btn-orange" onclick="b64Encode()">⬆ קודד ל-Base64</button>
      <button class="btn btn-secondary" onclick="clearB64()">✕ נקה</button>
    </div>

    <div class="card">
      <div class="card-label"><span></span> פלט</div>
      <div class="output-area">
        <button class="copy-btn" onclick="copyText('b64-output', this)">העתק</button>
        <textarea id="b64-output" readonly placeholder="התוצאה תופיע כאן..."></textarea>
      </div>
      <div id="b64-status"></div>
    </div>

  </div>

  <!-- ══════════ BASE64 IMAGE PANEL ══════════ -->
  <div class="panel" id="panel-b64img">

    <!-- Encode: image → base64 -->
    <div class="card">
      <div class="card-label"><span></span> תמונה → Base64</div>
      <div class="upload-zone" id="upload-zone">
        <input type="file" accept="image/*" onchange="imageToBase64(event)" id="img-file-input">
        <div class="uz-icon">📁</div>
        <div class="uz-text">גרור תמונה לכאן או <strong>לחץ לבחירה</strong></div>
      </div>
      <div id="img-encode-status" style="margin-top:0.5rem"></div>
      <div style="margin-top:1rem; display:none" id="img-encode-output-wrap">
        <div class="output-area">
          <button class="copy-btn" onclick="copyText('img-b64-output', this)">העתק</button>
          <textarea id="img-b64-output" readonly style="min-height:80px; font-size:0.75rem"></textarea>
        </div>
        <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap">
          <button class="btn btn-secondary" onclick="copyDataUrl()">העתק data:URL מלא</button>
          <button class="btn btn-secondary" onclick="downloadBase64()">⬇ שמור כ-TXT</button>
        </div>
      </div>
    </div>

    <div class="divider">פענוח</div>

    <!-- Decode: base64 → image -->
    <div class="card">
      <div class="card-label"><span></span> Base64 → תמונה</div>
      <div class="output-area">
        <textarea id="b64img-input" placeholder="הדבק כאן Base64 של תמונה (עם או בלי data:image/... prefix)..." style="min-height:100px; font-size:0.75rem"></textarea>
      </div>
      <div class="actions" style="margin-top:0.75rem">
        <button class="btn btn-primary" onclick="base64ToImage()">🖼️ הצג תמונה</button>
        <button class="btn btn-secondary" onclick="clearImgDecode()">✕ נקה</button>
      </div>
      <div id="b64img-status"></div>
      <div class="img-preview" id="img-preview">
        <img id="preview-img" src="" alt="תצוגה מקדימה">
        <div class="img-meta" id="img-meta"></div>
        <button class="btn btn-purple" style="margin: 0.75rem auto 0; display:flex" onclick="downloadImage()">⬇ הורד תמונה</button>
      </div>
    </div>

  </div>

  <footer>
    קודאר · כלי עזר אישי · פועל לגמרי בדפדפן, ללא שרת
  </footer>

</div>

<script>
// ─── Tab switching ─────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

// ─── Helpers ───────────────────────────────────────────
function setStatus(el, msg, type) {
  el.innerHTML = `<span class="status ${type}">${msg}</span>`;
}

function copyText(id, btn) {
  const val = document.getElementById(id).value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    btn.textContent = '✓ הועתק';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'העתק'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── URL Encode / Decode ───────────────────────────────
function urlDecode() {
  const inp = document.getElementById('url-input').value.trim();
  const statusEl = document.getElementById('url-status');
  if (!inp) return;
  try {
    // Try decodeURIComponent first, fallback to unescape for legacy %XX
    let result;
    try {
      result = decodeURIComponent(inp);
    } catch {
      result = unescape(inp);
    }
    document.getElementById('url-output').value = result;
    setStatus(statusEl, '✓ פוענח בהצלחה', 'ok');
  } catch (e) {
    document.getElementById('url-output').value = '';
    setStatus(statusEl, '✗ שגיאה בפענוח: ' + e.message, 'err');
  }
}

function urlEncode() {
  const inp = document.getElementById('url-input').value;
  const statusEl = document.getElementById('url-status');
  if (!inp) return;
  try {
    document.getElementById('url-output').value = encodeURIComponent(inp);
    setStatus(statusEl, '✓ קודד בהצלחה', 'ok');
  } catch (e) {
    setStatus(statusEl, '✗ שגיאה: ' + e.message, 'err');
  }
}

function clearUrl() {
  document.getElementById('url-input').value = '';
  document.getElementById('url-output').value = '';
  document.getElementById('url-status').innerHTML = '';
}

// Allow pasting into output → becomes input
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('url-output').addEventListener('dblclick', function() {
    document.getElementById('url-input').value = this.value;
    this.value = '';
    document.getElementById('url-status').innerHTML = '';
  });
});

// ─── Base64 Text ───────────────────────────────────────
function b64Encode() {
  const inp = document.getElementById('b64-input').value;
  const statusEl = document.getElementById('b64-status');
  if (!inp) return;
  try {
    const encoded = btoa(unescape(encodeURIComponent(inp)));
    document.getElementById('b64-output').value = encoded;
    setStatus(statusEl, '✓ קודד בהצלחה · ' + encoded.length + ' תווים', 'ok');
  } catch (e) {
    setStatus(statusEl, '✗ שגיאה: ' + e.message, 'err');
  }
}

function b64Decode() {
  const inp = document.getElementById('b64-input').value.trim();
  const statusEl = document.getElementById('b64-status');
  if (!inp) return;
  try {
    const decoded = decodeURIComponent(escape(atob(inp)));
    document.getElementById('b64-output').value = decoded;
    setStatus(statusEl, '✓ פוענח בהצלחה · ' + decoded.length + ' תווים', 'ok');
  } catch (e) {
    setStatus(statusEl, '✗ Base64 לא תקין: ' + e.message, 'err');
  }
}

function clearB64() {
  document.getElementById('b64-input').value = '';
  document.getElementById('b64-output').value = '';
  document.getElementById('b64-status').innerHTML = '';
}

// ─── Image → Base64 ────────────────────────────────────
let currentDataUrl = '';
let currentMime = '';

function imageToBase64(event) {
  const file = event.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('img-encode-status');
  const reader = new FileReader();
  reader.onload = function(e) {
    currentDataUrl = e.target.result;
    currentMime = file.type;
    const b64 = currentDataUrl.split(',')[1];
    document.getElementById('img-b64-output').value = b64;
    document.getElementById('img-encode-output-wrap').style.display = 'block';
    const kb = (file.size / 1024).toFixed(1);
    setStatus(statusEl, `✓ ${file.name} · ${file.type} · ${kb} KB · Base64: ${b64.length} תווים`, 'ok');
  };
  reader.onerror = () => setStatus(statusEl, '✗ שגיאה בקריאת קובץ', 'err');
  reader.readAsDataURL(file);
}

function copyDataUrl() {
  if (!currentDataUrl) return;
  navigator.clipboard.writeText(currentDataUrl).then(() => alert('data:URL הועתק'));
}

function downloadBase64() {
  const val = document.getElementById('img-b64-output').value;
  if (!val) return;
  const blob = new Blob([val], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'image_base64.txt';
  a.click();
}

// Drag & drop
const zone = document.getElementById('upload-zone');
if (zone) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      const fakeEvent = { target: { files: [file] } };
      imageToBase64(fakeEvent);
    }
  });
}

// ─── Base64 → Image ────────────────────────────────────
function base64ToImage() {
  let inp = document.getElementById('b64img-input').value.trim();
  const statusEl = document.getElementById('b64img-status');
  const preview = document.getElementById('img-preview');
  const imgEl = document.getElementById('preview-img');
  const metaEl = document.getElementById('img-meta');

  if (!inp) return;

  let dataUrl;
  if (inp.startsWith('data:')) {
    dataUrl = inp;
  } else {
    // Try to detect mime from first bytes
    let mime = 'image/png';
    try {
      const bytes = atob(inp.replace(/\s/g, '').substring(0, 12));
      const b = bytes.charCodeAt;
      if (bytes.charCodeAt(0) === 0xFF && bytes.charCodeAt(1) === 0xD8) mime = 'image/jpeg';
      else if (bytes.charCodeAt(0) === 0x47 && bytes.charCodeAt(1) === 0x49) mime = 'image/gif';
      else if (bytes.charCodeAt(0) === 0x52 && bytes.charCodeAt(1) === 0x49) mime = 'image/webp';
    } catch {}
    dataUrl = `data:${mime};base64,${inp.replace(/\s/g, '')}`;
  }

  imgEl.onload = function() {
    preview.classList.add('visible');
    const w = imgEl.naturalWidth, h = imgEl.naturalHeight;
    metaEl.textContent = `${w} × ${h} px`;
    setStatus(statusEl, `✓ תמונה טעונה · ${w}×${h}`, 'ok');
  };
  imgEl.onerror = function() {
    preview.classList.remove('visible');
    setStatus(statusEl, '✗ לא ניתן לפענח כתמונה — בדוק שהBase64 תקין', 'err');
  };
  imgEl.src = dataUrl;
  currentDataUrl = dataUrl;
}

function downloadImage() {
  if (!currentDataUrl || !currentDataUrl.startsWith('data:image')) return;
  const ext = currentDataUrl.split(';')[0].split('/')[1] || 'png';
  const a = document.createElement('a');
  a.href = currentDataUrl;
  a.download = 'decoded_image.' + ext;
  a.click();
}

function clearImgDecode() {
  document.getElementById('b64img-input').value = '';
  document.getElementById('b64img-status').innerHTML = '';
  document.getElementById('img-preview').classList.remove('visible');
  document.getElementById('preview-img').src = '';
}

// ─── Keyboard shortcuts ────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const active = document.querySelector('.panel.active').id;
    if (active === 'panel-url') urlDecode();
    else if (active === 'panel-b64text') b64Decode();
  }
});
</script>
</body>
</html>
